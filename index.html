<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <title>My Academic Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-20 antialiased select-none">
  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Header -->
    <header class="flex justify-between items-center pt-2">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white">Academic Hub</h1>
        <p id="sync-status" class="text-xs text-zinc-500 font-medium">Ready</p>
      </div>
      <div class="flex gap-2">
        <button onclick="fetchData()" class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-2xl active:scale-90 transition">
          ⚡
        </button>
      </div>
    </header>

    <!-- Schedule Feed -->
    <main id="content" class="space-y-3 fade-in"></main>
  </div>

  <script>
    const SUPABASE_URL = "https://maasiiydnlbdovgkcndo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hYXNpaXlkbmxiZG92Z2tjbmRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NzUyMTYsImV4cCI6MjEwNTI1MTIxNn0.QuSb9W5Iaj0_sDFC8WAhTp2JkM3ItfOKqTy2ZxowyO8";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchData() {
      const status = document.getElementById('sync-status');
      status.innerText = 'Refreshing...';

      try {
        const { data, error } = await client.from('academic_records').select('*');
        if (error) throw error;

        const meta = data.find(r => r.id === 'metadata');
        if (meta?.content?.last_sync) {
          const d = new Date(meta.content.last_sync);
          status.innerText = `Updated: ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        } else {
          status.innerText = 'Connected';
        }

        localStorage.setItem('hub_cached_data', JSON.stringify(data));
        render(data);
      } catch (err) {
        status.innerText = 'Offline Cache';
      }
    }

    function render(records) {
      const container = document.getElementById('content');
      container.innerHTML = '';

      const tt = records.find(r => r.id === 'timetable');
      if (!tt || !tt.content) {
        container.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs">No records available.</div>`;
        return;
      }

      const raw = tt.content;
      // Extract all items from MyCamu's output.data format
      let rawList = raw?.output?.data || raw?.data || (Array.isArray(raw) ? raw : []);
      let events = [];

      rawList.forEach(group => {
        if (group.Holiday && Array.isArray(group.Holiday)) events.push(...group.Holiday);
        if (group.Schedule && Array.isArray(group.Schedule)) events.push(...group.Schedule);
        if (group.schedule && Array.isArray(group.schedule)) events.push(...group.schedule);
        if (group.Period && Array.isArray(group.Period)) events.push(...group.Period);
        if (group.periods && Array.isArray(group.periods)) events.push(...group.periods);
        if (group.title || group.start) events.push(group);

        for (let k of Object.keys(group)) {
          if (!['Holiday', 'Schedule', 'schedule', 'Period', 'periods'].includes(k) && Array.isArray(group[k])) {
            events.push(...group[k]);
          }
        }
      });

      if (events.length === 0) {
        container.innerHTML = `
          <div class="p-8 bg-zinc-900/40 border border-zinc-800/60 rounded-3xl text-center space-y-1">
            <p class="text-sm font-semibold text-zinc-300">No classes scheduled</p>
            <p class="text-xs text-zinc-500">Your week is currently free!</p>
          </div>`;
        return;
      }

      events.forEach(item => {
        const isHoliday = item.eTy === 'Holiday' || item.title?.toLowerCase().includes('holiday') || item.allDay;
        
        let dateStr = '';
        if (item.start) {
          try {
            const d = new Date(item.start);
            dateStr = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          } catch(e) {}
        }

        if (isHoliday) {
          // Holiday Card
          container.innerHTML += `
            <div class="p-4 bg-emerald-950/40 border border-emerald-800/60 rounded-2xl shadow-sm space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase tracking-wider">
                  🎉 Holiday
                </span>
                <span class="text-xs text-emerald-300/80 font-medium">${dateStr}</span>
              </div>
              <h3 class="font-bold text-base text-emerald-100">${item.title || 'Holiday'}</h3>
            </div>
          `;
        } else {
          // Class / Lecture Card
          let timeText = item.time || '';
          if (!timeText && item.start && item.end) {
            try {
              const s = new Date(item.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              const e = new Date(item.end).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              timeText = `${s} - ${e}`;
            } catch(e) {}
          }

          container.innerHTML += `
            <div class="p-4 bg-zinc-900/90 border border-zinc-800/80 rounded-2xl shadow-sm space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-wider">
                  ${timeText || dateStr || 'Class'}
                </span>
                <span class="text-xs text-zinc-400 font-medium">${item.room || item.RmNm || item.location || ''}</span>
              </div>
              <h3 class="font-semibold text-sm text-zinc-100">${item.subject || item.title || item.subNm || item.courseName || 'Lecture'}</h3>
              ${item.faculty || item.teacher || item.empNm ? `<p class="text-xs text-zinc-500">${item.faculty || item.teacher || item.empNm}</p>` : ''}
            </div>
          `;
        }
      });
    }

    // Instant offline render
    const saved = localStorage.getItem('hub_cached_data');
    if (saved) {
      try { render(JSON.parse(saved)); } catch(e) {}
    }

    fetchData();
  </script>
</body>
</html>
