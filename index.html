<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <title>My Academic Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-16 antialiased select-none">
  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Top Header -->
    <header class="flex justify-between items-center pt-2">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">My Academic Hub</h1>
        <p id="sync-status" class="text-[11px] text-zinc-400 font-medium">Connecting...</p>
      </div>
      <button onclick="fetchData()" class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-2xl active:scale-90 transition">
        ⚡
      </button>
    </header>

    <!-- Error Banner (shows only if connection fails) -->
    <div id="error-box" class="hidden p-3 bg-red-950/80 border border-red-800 rounded-xl text-xs text-red-200"></div>

    <!-- Main Schedule Container -->
    <main id="content" class="space-y-3 fade-in">
      <div class="p-8 text-center text-zinc-500 text-xs animate-pulse">
        Loading your schedule...
      </div>
    </main>
  </div>

  <script>
    // YOUR VERIFIED SUPABASE KEYS (FIXED BASE URL)
    const SUPABASE_URL = "https://maasiiydnlbdovgkcndo.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hYXNpaXlkbmxiZG92Z2tjbmRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NzUyMTYsImV4cCI6MjEwNTI1MTIxNn0.QuSb9W5Iaj0_sDFC8WAhTp2JkM3ItfOKqTy2ZxowyO8";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchData() {
      const status = document.getElementById('sync-status');
      const errorBox = document.getElementById('error-box');
      errorBox.classList.add('hidden');
      status.innerText = 'Refreshing...';

      try {
        const { data, error } = await client.from('academic_records').select('*');
        if (error) throw error;

        if (!data || data.length === 0) {
          document.getElementById('content').innerHTML = `
            <div class="p-8 bg-zinc-900/40 border border-zinc-800 rounded-3xl text-center space-y-1">
              <p class="text-sm font-semibold text-zinc-300">No data found in database</p>
              <p class="text-xs text-zinc-500">Run the sync action on GitHub first.</p>
            </div>`;
          status.innerText = 'Empty Database';
          return;
        }

        // Cache data on the phone
        localStorage.setItem('cached_portal_data', JSON.stringify(data));

        const meta = data.find(r => r.id === 'metadata');
        if (meta && meta.content && meta.content.last_sync) {
          const t = new Date(meta.content.last_sync);
          status.innerText = `Updated: ${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        } else {
          status.innerText = 'Up to date';
        }

        render(data);
      } catch (err) {
        status.innerText = 'Connection Error';
        errorBox.classList.remove('hidden');
        errorBox.innerText = "Error: " + (err.message || err);
      }
    }

    function render(records) {
      const container = document.getElementById('content');
      container.innerHTML = '';

      const tt = records.find(r => r.id === 'timetable');
      if (!tt || !tt.content) {
        container.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs">No timetable record found.</div>`;
        return;
      }

      const raw = tt.content;
      let list = Array.isArray(raw) ? raw : (raw.data || raw.schdl || raw.periods || raw.result || []);

      if (!Array.isArray(list) || list.length === 0) {
        // Formatted display fallback for custom MyCamu object structures
        container.innerHTML = `
          <div class="p-4 bg-zinc-900/80 border border-zinc-800 rounded-2xl text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96">
            ${JSON.stringify(raw, null, 2)}
          </div>`;
        return;
      }

      list.forEach(item => {
        const time = item.time || (item.frTm && item.toTm ? `${item.frTm} - ${item.toTm}` : item.period || 'Class');
        const subject = item.subject || item.subNm || item.courseName || item.title || item.CrNm || 'Course';
        const room = item.room || item.RmNm || item.location || '';
        const faculty = item.faculty || item.empNm || item.teacher || item.staff || '';

        container.innerHTML += `
          <div class="p-4 bg-zinc-900/90 border border-zinc-800 rounded-2xl shadow-sm space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-wider">
                ${time}
              </span>
              <span class="text-xs text-zinc-400">${room}</span>
            </div>
            <h3 class="font-semibold text-sm text-zinc-100">${subject}</h3>
            ${faculty ? `<p class="text-xs text-zinc-500">${faculty}</p>` : ''}
          </div>`;
      });
    }

    // Load instantly from phone cache
    const saved = localStorage.getItem('cached_portal_data');
    if (saved) {
      try { render(JSON.parse(saved)); } catch(e) {}
    }

    fetchData();
  </script>
</body>
</html>
