<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#09090b">
  <title>My Academic Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-16 antialiased select-none">
  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Top Header -->
    <header class="flex justify-between items-center pt-2">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">My Academic Hub</h1>
        <p id="sync-status" class="text-[11px] text-zinc-400 font-medium">Ready</p>
      </div>
      <div class="flex gap-2">
        <button onclick="openKeyModal()" class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-2xl active:scale-90 text-xs">
          🔑
        </button>
        <button onclick="fetchData()" class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-2xl active:scale-90">
          ⚡
        </button>
      </div>
    </header>

    <!-- Paste Key Setup Box (Shows if Key is Invalid) -->
    <div id="key-setup" class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl space-y-3">
      <p class="text-xs font-semibold text-zinc-200">🔑 Paste Your Supabase Anon Key</p>
      <p class="text-[11px] text-zinc-400">Copy the "Anon" key from your Realme Notes and paste it below:</p>
      <textarea id="key-input" rows="3" class="w-full p-2.5 bg-black border border-zinc-700 rounded-xl text-xs font-mono text-zinc-200 focus:outline-none focus:border-blue-500" placeholder="Paste eyJhbGci... here"></textarea>
      <button onclick="saveKey()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 active:scale-95 rounded-xl text-xs font-semibold text-white transition">
        Save & Connect
      </button>
    </div>

    <!-- Error Banner -->
    <div id="error-box" class="hidden p-3 bg-red-950/80 border border-red-800 rounded-xl text-xs text-red-200"></div>

    <!-- Content Area -->
    <main id="content" class="space-y-3"></main>
  </div>

  <script>
    const SUPABASE_URL = "https://maasiiydnlbdovgkcndo.supabase.co";

    function getActiveKey() {
      return localStorage.getItem('user_supabase_key') || "";
    }

    function openKeyModal() {
      document.getElementById('key-setup').classList.toggle('hidden');
    }

    function saveKey() {
      const val = document.getElementById('key-input').value.trim();
      if (!val.startsWith('ey')) {
        alert("Please paste a valid key starting with 'ey'!");
        return;
      }
      localStorage.setItem('user_supabase_key', val);
      document.getElementById('key-setup').classList.add('hidden');
      fetchData();
    }

    async function fetchData() {
      const key = getActiveKey();
      const setupBox = document.getElementById('key-setup');
      const status = document.getElementById('sync-status');
      const errorBox = document.getElementById('error-box');
      errorBox.classList.add('hidden');

      if (!key) {
        setupBox.classList.remove('hidden');
        status.innerText = 'Key required';
        return;
      }

      status.innerText = 'Connecting...';

      try {
        const client = supabase.createClient(SUPABASE_URL, key);
        const { data, error } = await client.from('academic_records').select('*');

        if (error) {
          setupBox.classList.remove('hidden');
          throw error;
        }

        setupBox.classList.add('hidden');
        status.innerText = 'Connected';

        // Cache on device
        localStorage.setItem('cached_records', JSON.stringify(data));
        render(data);

      } catch (err) {
        status.innerText = 'Connection Error';
        errorBox.classList.remove('hidden');
        errorBox.innerText = "Error: " + (err.message || err);
      }
    }

    function render(records) {
      const container = document.getElementById('content');
      container.innerHTML = '';

      const tt = records.find(r => r.id === 'timetable');
      if (!tt || !tt.content) {
        container.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs">No timetable record found.</div>`;
        return;
      }

      const raw = tt.content;
      let list = Array.isArray(raw) ? raw : (raw.data || raw.schdl || raw.periods || raw.result || []);

      if (!Array.isArray(list) || list.length === 0) {
        container.innerHTML = `
          <div class="p-4 bg-zinc-900/80 border border-zinc-800 rounded-2xl text-xs font-mono whitespace-pre-wrap overflow-auto max-h-96">
            ${JSON.stringify(raw, null, 2)}
          </div>`;
        return;
      }

      list.forEach(item => {
        const time = item.time || (item.frTm && item.toTm ? `${item.frTm} - ${item.toTm}` : item.period || 'Class');
        const subject = item.subject || item.subNm || item.courseName || item.title || item.CrNm || 'Course';
        const room = item.room || item.RmNm || item.location || '';
        const faculty = item.faculty || item.empNm || item.teacher || item.staff || '';

        container.innerHTML += `
          <div class="p-4 bg-zinc-900/90 border border-zinc-800 rounded-2xl shadow-sm space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-wider">
                ${time}
              </span>
              <span class="text-xs text-zinc-400">${room}</span>
            </div>
            <h3 class="font-semibold text-sm text-zinc-100">${subject}</h3>
            ${faculty ? `<p class="text-xs text-zinc-500">${faculty}</p>` : ''}
          </div>`;
      });
    }

    // Try loading offline cache first
    const saved = localStorage.getItem('cached_records');
    if (saved) {
      try { render(JSON.parse(saved)); } catch(e) {}
    }

    fetchData();
  </script>
</body>
</html>
