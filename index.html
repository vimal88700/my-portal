<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <title>Academic Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .fade { animation: f 0.15s ease-in-out; }
    @keyframes f { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-16 antialiased select-none">
  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Top Header -->
    <header class="flex justify-between items-center pt-2">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">My Academic Hub</h1>
        <p id="sync-status" class="text-[11px] text-zinc-500 font-medium">Ready</p>
      </div>
      <button onclick="refreshFromDatabase()" class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-2xl active:scale-90 transition">
        ⚡
      </button>
    </header>

    <!-- Tabs -->
    <div class="grid grid-cols-2 p-1 bg-zinc-900/90 border border-zinc-800/80 rounded-2xl">
      <button id="tab-tt" onclick="switchTab('timetable')" class="py-2 text-xs font-semibold rounded-xl bg-zinc-800 text-white shadow-sm transition">
        Timetable
      </button>
      <button id="tab-as" onclick="switchTab('assignments')" class="py-2 text-xs font-semibold rounded-xl text-zinc-400 transition">
        Assignments
      </button>
    </div>

    <!-- Content Area -->
    <main id="content" class="space-y-3 fade"></main>
  </div>

  <script>
    // PUT YOUR KEYS HERE
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let activeTab = 'timetable';
    let dataCache = { timetable: [], assignments: [], last_sync: null };

    // Instant load from memory (0 milliseconds)
    function init() {
      const local = localStorage.getItem('hub_cache');
      if (local) {
        try {
          dataCache = JSON.parse(local);
          render();
        } catch (e) {}
      }
      refreshFromDatabase();
    }

    // Silent background check
    async function refreshFromDatabase() {
      const status = document.getElementById('sync-status');
      status.innerText = 'Checking updates...';

      try {
        const { data, error } = await client.from('academic_records').select('*');
        if (error || !data) throw error;

        data.forEach(r => {
          if (r.id === 'timetable') dataCache.timetable = r.content;
          if (r.id === 'assignments') dataCache.assignments = r.content;
          if (r.id === 'metadata') dataCache.last_sync = r.content.last_sync;
        });

        localStorage.setItem('hub_cache', JSON.stringify(dataCache));

        if (dataCache.last_sync) {
          const t = new Date(dataCache.last_sync);
          status.innerText = `Updated: ${t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        } else {
          status.innerText = 'Up to date';
        }

        render();
      } catch (err) {
        status.innerText = 'Showing offline cache';
      }
    }

    function switchTab(t) {
      activeTab = t;
      const isTt = t === 'timetable';
      document.getElementById('tab-tt').className = isTt 
        ? "py-2 text-xs font-semibold rounded-xl bg-zinc-800 text-white shadow-sm transition"
        : "py-2 text-xs font-semibold rounded-xl text-zinc-400 transition";
      document.getElementById('tab-as').className = !isTt 
        ? "py-2 text-xs font-semibold rounded-xl bg-zinc-800 text-white shadow-sm transition"
        : "py-2 text-xs font-semibold rounded-xl text-zinc-400 transition";
      render();
    }

    function render() {
      const box = document.getElementById('content');
      box.className = 'space-y-3 fade';
      box.innerHTML = '';

      const items = activeTab === 'timetable' ? dataCache.timetable : dataCache.assignments;
      const list = Array.isArray(items) ? items : (items?.data || items?.result || []);

      if (list.length === 0) {
        box.innerHTML = `
          <div class="p-8 bg-zinc-900/40 border border-zinc-800/60 rounded-3xl text-center space-y-1">
            <p class="text-sm font-semibold text-zinc-300">No entries yet</p>
            <p class="text-xs text-zinc-500">Run a manual sync on GitHub to pull data.</p>
          </div>`;
        return;
      }

      list.forEach(item => {
        if (activeTab === 'timetable') {
          box.innerHTML += `
            <div class="p-4 bg-zinc-900/90 border border-zinc-800/80 rounded-2xl shadow-sm space-y-1.5">
              <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-wider">
                  ${item.time || item.period || 'Scheduled'}
                </span>
                <span class="text-xs text-zinc-400">${item.room || 'Room N/A'}</span>
              </div>
              <h3 class="font-semibold text-sm text-zinc-100">${item.subject || item.courseName || 'Course'}</h3>
              <p class="text-xs text-zinc-500">${item.faculty || item.teacher || ''}</p>
            </div>`;
        } else {
          box.innerHTML += `
            <div class="p-4 bg-zinc-900/90 border border-zinc-800/80 rounded-2xl shadow-sm space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20 uppercase tracking-wider">
                  Due: ${item.dueDate || 'Pending'}
                </span>
              </div>
              <h3 class="font-semibold text-sm text-zinc-100">${item.title || item.name || 'Assignment'}</h3>
              <p class="text-xs text-zinc-400">${item.description || item.subject || ''}</p>
            </div>`;
        }
      });
    }

    init();
  </script>
</body>
</html>
