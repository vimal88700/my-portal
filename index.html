<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Academic Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 pb-20 select-none">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <header class="flex justify-between items-center pt-2">
      <div>
        <h1 class="text-2xl font-extrabold text-white">Academic Hub</h1>
        <p id="status" class="text-xs text-zinc-400 font-medium">Checking...</p>
      </div>
      <button onclick="loadNow()" class="p-2.5 bg-zinc-900 border border-zinc-800 rounded-2xl active:scale-90">
        ⚡
      </button>
    </header>

    <!-- Paste Key Box (Shows if key is wrong) -->
    <div id="box" class="p-4 bg-zinc-900 border border-blue-900/60 rounded-2xl space-y-2">
      <p class="text-xs font-bold text-blue-300">🔑 Paste Your Supabase Key Once:</p>
      <input id="key-field" type="text" class="w-full p-2 bg-black border border-zinc-700 rounded-xl text-xs text-zinc-200" placeholder="Paste Anon key here...">
      <button onclick="saveAndGo()" class="w-full py-2 bg-blue-600 rounded-xl text-xs font-bold text-white active:scale-95">
        Save & Show Schedule
      </button>
    </div>

    <!-- Output Feed -->
    <main id="list" class="space-y-3"></main>
  </div>

  <script>
    const URL = "https://maasiiydnlbdovgkcndo.supabase.co";

    function saveAndGo() {
      const k = document.getElementById('key-field').value.trim();
      if (!k) return alert("Please paste the key!");
      localStorage.setItem('hub_key', k);
      loadNow();
    }

    async function loadNow() {
      const key = localStorage.getItem('hub_key') || "";
      const status = document.getElementById('status');
      const box = document.getElementById('box');
      const list = document.getElementById('list');

      if (!key) {
        box.classList.remove('hidden');
        status.innerText = "Paste key above 👆";
        return;
      }

      status.innerText = "Loading schedule...";

      try {
        const client = supabase.createClient(URL, key);
        const { data, error } = await client.from('academic_records').select('*');

        if (error) {
          box.classList.remove('hidden');
          status.innerText = "Key error: " + error.message;
          return;
        }

        box.classList.add('hidden');
        status.innerText = "Connected";

        const tt = data.find(r => r.id === 'timetable');
        if (!tt || !tt.content) {
          list.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs">No timetable record in database.</div>`;
          return;
        }

        // Parse MyCamu records
        const raw = tt.content;
        let groups = raw?.output?.data || raw?.data || (Array.isArray(raw) ? raw : []);
        let events = [];

        groups.forEach(g => {
          if (g.Holiday) events.push(...g.Holiday);
          if (g.Schedule) events.push(...g.Schedule);
          if (g.schedule) events.push(...g.schedule);
          if (g.Period) events.push(...g.Period);
          if (g.title || g.start) events.push(g);
        });

        if (events.length === 0) {
          list.innerHTML = `<div class="p-6 text-center text-zinc-500 text-xs">No scheduled events.</div>`;
          return;
        }

        list.innerHTML = '';
        events.forEach(item => {
          const isHoliday = item.eTy === 'Holiday' || item.title?.toLowerCase().includes('holiday') || item.allDay;
          let dateStr = item.start ? new Date(item.start).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';

          if (isHoliday) {
            list.innerHTML += `
              <div class="p-4 bg-emerald-950/40 border border-emerald-800/60 rounded-2xl space-y-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 uppercase">🎉 Holiday</span>
                <p class="text-xs text-emerald-300 font-medium">${dateStr}</p>
                <h3 class="font-bold text-base text-emerald-100">${item.title}</h3>
              </div>`;
          } else {
            list.innerHTML += `
              <div class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl space-y-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 uppercase">${item.time || dateStr || 'Class'}</span>
                <h3 class="font-semibold text-sm text-white">${item.subject || item.title || 'Lecture'}</h3>
                <p class="text-xs text-zinc-400">${item.room || ''}</p>
              </div>`;
          }
        });

      } catch (e) {
        status.innerText = "Error: " + e.message;
      }
    }

    loadNow();
  </script>
</body>
</html>
